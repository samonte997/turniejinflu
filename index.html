<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Top Polska Influencerka - Jackbox Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #f0f0f0;
            text-align: center;
        }

        header {
            background-color: #1f1f1f;
            padding: 1.5em 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        section {
            max-width: 900px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
        }

        h2 {
            margin-bottom: 0.5em;
        }

        /* Formularze */
        form {
            margin-bottom: 1.2em;
        }

        input[type="text"], input[type="url"], select {
            padding: 6px 10px;
            font-size: 1rem;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #222;
            color: #eee;
            width: 200px;
        }

        button {
            padding: 6px 14px;
            margin-left: 8px;
            background-color: #333;
            color: #ffcc00;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover:not(:disabled) {
            background-color: #ffcc00;
            color: #121212;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #category-select-container {
            margin-bottom: 20px;
        }
        
        #category-select-container label {
            display: inline-block;
            margin: 0 12px 8px 0;
            cursor: pointer;
            user-select: none;
        }

        #category-select-container input[type="checkbox"] {
            transform: scale(1.2);
            margin-right: 6px;
            vertical-align: middle;
        }

        #people-list .person-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1e1e1e;
            border-radius: 8px;
            margin-bottom: 8px;
            padding: 10px;
        }

        .person-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .person-info img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .person-info .name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .person-info .cat {
            font-size: 0.9rem;
            color: #bbb;
            margin-left: 10px;
        }

        .person-actions button {
            background-color: #aa2222;
            border-radius: 5px;
            padding: 6px 10px;
        }

        .person-actions button:hover {
            background-color: #ff4444;
        }

        .hidden-section {
            display: none !important;
        }

        #choice-container {
            display: none;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            margin-top: 30px;
            gap: 40px;
            flex-wrap: nowrap;
            max-width: none;
        }

        .person-choice {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            width: 40%;
            max-width: 400px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            min-height: 480px;
            justify-content: space-between;
        }

        .person-choice:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px #ffcc00;
        }

        .person-choice img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .person-choice h3 {
            margin: 0 0 5px;
            font-size: 2.2rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.2;
            text-align: center;
        }

        .person-choice p {
            margin: 0;
            font-size: 1.3rem;
            color: #ccc;
            text-align: center;
            line-height: 1.2;
        }

        #vs-text {
            font-size: 3.5rem;
            line-height: 1;
            color: #777;
            align-self: center;
            margin: 0 20px;
        }

        #round-indicator {
            margin-top: 25px;
            font-size: 1.8rem;
            font-weight: 600;
            color: #ffcc00;
        }

        #bye-message {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #ff8c00;
            opacity: 0;
            transition: opacity 1s ease-out;
            min-height: 25px;
        }

        #winner-display {
            margin-top: 30px;
        }

        #winner-display h2 {
            font-size: 2.5rem;
            color: #ffcc00;
        }

        #winner-display img {
            width: 350px;
            height: 350px;
            border-radius: 10px;
            margin-top: 15px;
            object-fit: cover;
        }

        #export-import {
            margin-top: 30px;
        }

        #export-import button {
            margin-right: 15px;
        }

        /* Tryb Jackbox Host Area */
        #jackbox-host-panel {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 400px;
            border: 2px dashed #ffcc00;
            display: none;
        }
        #jackbox-qr img {
            background: white;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
        }

        /* NOWY EKRAN KONTROLERA DLA TELEFONU */
        #voter-mobile-screen {
            display: none;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .mobile-vote-btn {
            display: block;
            width: 100%;
            padding: 25px;
            margin: 20px 0;
            font-size: 1.6rem;
            font-weight: bold;
            color: #121212;
            background: #ffcc00;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,204,0,0.3);
        }
        .mobile-vote-btn:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
        }
        #mobile-status {
            font-size: 1.2rem;
            color: #aaa;
            margin-top: 30px;
        }

        @media (max-width: 1024px) {
            .person-choice { max-width: 320px; min-height: 400px; }
            .person-choice img { height: 300px; }
            .person-choice h3 { font-size: 1.8rem; }
            .person-choice p { font-size: 1.1rem; }
            #vs-text { font-size: 2.8rem; margin: 0 15px; }
        }

        @media (max-width: 768px) {
            #choice-container { gap: 20px; }
            .person-choice { width: 45%; max-width: 250px; padding: 15px; min-height: 350px; }
            .person-choice img { height: 250px; }
            .person-choice h3 { font-size: 1.5rem; }
            .person-choice p { font-size: 0.9rem; }
            #vs-text { font-size: 2.2rem; }
        }

        @media (max-width: 480px) {
             #choice-container { gap: 10px; }
            .person-choice { width: 48%; max-width: 200px; padding: 10px; min-height: 300px; }
            .person-choice img { height: 200px; }
            .person-choice h3 { font-size: 1.2rem; }
            .person-choice p { font-size: 0.8rem; }
            #vs-text { font-size: 1.8rem; margin: 0 5px; }
            header h1 { font-size: 1.8rem; }
            #round-indicator { font-size: 1.3rem; }
            #winner-display h2 { font-size: 1.8rem; }
            #winner-display img { width: 200px; height: 200px; }
        }

        #voting-mode-settings {
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #voting-mode-settings label {
            font-size: 1rem;
            color: #ccc;
        }

        #vote-progress {
            margin: 10px 0;
            font-size: 1.1rem;
            color: #aaa;
            min-height: 28px;
        }

        .person-choice.winner-flash {
            box-shadow: 0 0 40px #ffcc00, 0 0 80px #ffcc0066;
            transform: scale(1.05);
            transition: box-shadow 0.3s, transform 0.3s;
        }
        .person-choice.loser-fade {
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        #vote-result-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 12px 0 0 0;
            font-size: 1.3rem;
            font-weight: 700;
            min-height: 36px;
        }
        .vote-count {
            color: #ffcc00;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body>

<div id="voter-mobile-screen">
    <header style="margin-bottom: 30px;">
        <h1>Twój Pilot</h1>
    </header>
    <h2 id="mobile-pair-title">Oczekiwanie na rozpoczęcie pojedynku...</h2>
    <div style="margin: 10px 0 25px 0;">
        <input type="text" id="mobile-voter-name" placeholder="Twoje Imię/Nick" style="width:80%; padding:10px; font-size:1.1rem;" />
    </div>
    <button id="mobile-btn-left" class="mobile-vote-btn" disabled>Wybierz Lewą</button>
    <button id="mobile-btn-right" class="mobile-vote-btn" disabled>Wybierz Prawą</button>
    <div id="mobile-status">Połączono z pokojem.</div>
</div>

<div id="main-host-screen">
    <header>
        <h1>Top Polska Influencerka</h1>
    </header>

    <section id="people-management">
        <h2>Zarządzaj osobami</h2>
        <form id="add-person-form">
            <input id="new-name" placeholder="Imię i nazwisko" required type="text"/>
            <input id="new-image" placeholder="URL zdjęcia" required type="text"/>
            <input id="new-person-description" placeholder="Kategoria / Opis" required type="text"/>
            <button type="submit">Dodaj osobę</button>
        </form>
        <div class="people-list" id="people-list"></div>
    </section>

    <section id="import-export">
        <button id="export-excel-btn">Eksportuj do Excela</button>
        <button id="export-btn">Eksportuj dane (JSON)</button>
        <button id="import-btn">Importuj dane (JSON)</button>
        <input accept=".json" id="file-input" style="display:none;" type="file"/>
        <button id="import-excel-btn">Importuj z Excela</button>
        <input accept=".xlsx" id="import-excel-input" style="display:none;" type="file"/>
    </section>

    <section id="tournament-section">
        <h2>Turniej</h2>
        <div id="category-select-container"></div>

        <div id="voting-mode-settings">
            <label>
                <input type="checkbox" id="voting-mode-toggle" style="transform:scale(1.2);margin-right:6px;vertical-align:middle;">
                <strong>Tryb Jackbox (głosowanie telefonami za pomocą kodu QR)</strong>
            </label>
        </div>

        <div id="jackbox-host-panel">
            <h3>Pokój: <span id="room-code-display" style="color:#ffcc00; font-size:1.6rem;">----</span></h3>
            <p>Dołącz skanując telefonem poniższy kod QR:</p>
            <div id="jackbox-qr"></div>
            <p style="font-size:0.9rem; color:#aaa; margin-top:5px;">Liczba połączonych pilotów: <span id="connected-count" style="color:#fff; font-weight:bold;">0</span></p>
        </div>

        <button id="start-btn" style="margin-top:12px;">Startuj turniej</button>
        <div id="limit-container" style="display: inline-block; margin-left: 1em;">
            Limit uczestników:
            <select id="participant-limit">
                <option value="">Bez limitu</option>
                <option value="4">4</option>
                <option value="8">8</option>
                <option value="16">16</option>
                <option value="32">32</option>
                <option value="64">64</option>
            </select>
        </div>
        <button id="reset-btn" style="margin-left:1em;">Resetuj turniej</button>
        <button id="restart-btn" style="margin-left:1em;">Zacznij od nowa</button>

        <div id="round-indicator"></div>
        <div id="vote-progress"></div>
        <div id="vote-result-bar"></div>
        <div id="bye-message"></div>
        <div id="choice-container">
            <div class="person-choice" id="choice1">
                <img alt="" src=""/>
                <h3></h3>
                <p></p>
            </div>
            <div class="vs" id="vs-text">VS</div>
            <div class="person-choice" id="choice2">
                <img alt="" src=""/>
                <h3></h3>
                <p></p>
            </div>
        </div>
        <div id="winner-display"></div>
    </section>
</div>

<script>
    // --- Sprawdzanie roli (Telefon vs Komputer) ---
    const urlParams = new URLSearchParams(window.location.search);
    const isVoter = urlParams.get('role') === 'voter';
    const roomCode = urlParams.get('room');

    let mqttClient = null;
    const baseTopic = "top_influ_tournament_room_";

    // --- Dane gry ---
    let people = [];
    let categories = [];
    let selectedCategories = new Set();
    let votingModeEnabled = false;

    // Zmienne zliczania głosów sieciowych
    let activeRoomId = "";
    let dynamicVotes = {}; // nick -> 0 lub 1
    let votersList = new Set();

    if (isVoter) {
        // JEŚLI TO TELEFON: Ukryj wszystko, pokaż tylko kontroler
        document.getElementById('main-host-screen').style.display = 'none';
        document.getElementById('voter-mobile-screen').style.display = 'block';
        setupMobileVoter();
    } else {
        // JEŚLI TO KOMPUTER: Normalna inicjalizacja
        initHostSystem();
    }

    // ==========================================
    // LOGIKA DLA TELEFONU (PILOT DO GŁOSOWANIA)
    // ==========================================
    function setupMobileVoter() {
        const statusDiv = document.getElementById('mobile-status');
        const titleDiv = document.getElementById('mobile-pair-title');
        const btnLeft = document.getElementById('mobile-btn-left');
        const btnRight = document.getElementById('mobile-btn-right');
        const nameInput = document.getElementById('mobile-voter-name');

        // Losowy unikalny domyślny nick
        if(!nameInput.value) {
            nameInput.value = "Gracz_" + Math.floor(Math.random() * 900 + 100);
        }

        // Łączenie z darmowym publicznym serwerem MQTT brokera HiveMQ przez bezpieczne WebSockets
        mqttClient = mqtt.connect('wss://broker.hivemq.com:8004/mqtt');

        mqttClient.on('connect', () => {
            statusDiv.textContent = `Połączono z pokojem ${roomCode}!`;
            mqttClient.subscribe(`${baseTopic}${roomCode}/host_to_voters`);
            // Zgłoś obecność pilota
            sendPing();
            setInterval(sendPing, 4000);
        });

        function sendPing() {
            mqttClient.publish(`${baseTopic}${roomCode}/voters_to_host`, JSON.stringify({type: 'ping', voter: nameInput.value}));
        }

        mqttClient.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());
            if (data.type === 'new_pair') {
                titleDiv.textContent = `${data.p1} VS ${data.p2}`;
                btnLeft.textContent = data.p1;
                btnRight.textContent = data.p2;
                btnLeft.disabled = false;
                btnRight.disabled = false;
                statusDiv.textContent = "Wybierz faworytkę!";
                btnLeft.style.background = "#ffcc00";
                btnRight.style.background = "#ffcc00";
            } else if (data.type === 'round_ended') {
                btnLeft.disabled = true;
                btnRight.disabled = true;
                titleDiv.textContent = "Pojedynek zakończony!";
                statusDiv.textContent = "Oczekiwanie na następną parę...";
            }
        });

        btnLeft.onclick = () => sendVote(0, btnLeft, btnRight);
        btnRight.onclick = () => sendVote(1, btnRight, btnLeft);

        function sendVote(index, clickedBtn, otherBtn) {
            const votePayload = {
                type: 'vote',
                voter: nameInput.value.trim() || "Anonim",
                choice: index
            };
            mqttClient.publish(`${baseTopic}${roomCode}/voters_to_host`, JSON.stringify(votePayload));
            clickedBtn.disabled = true;
            otherBtn.disabled = true;
            clickedBtn.style.background = "#22bb22";
            statusDiv.textContent = "Głos wysłany! Czekaj na resztę grupy.";
        }
    }

    // ==========================================
    // LOGIKA DLA KOMPUTERA (HOST / EKRAN GŁÓWNY)
    // ==========================================
    function initHostSystem() {
        const votingToggle = document.getElementById('voting-mode-toggle');
        const jackboxPanel = document.getElementById('jackbox-host-panel');

        votingToggle.onchange = () => {
            votingModeEnabled = votingToggle.checked;
            jackboxPanel.style.display = votingModeEnabled ? 'block' : 'none';
            if (votingModeEnabled && !activeRoomId) {
                generateJackboxRoom();
            }
        };

        // Reszta standardowych powiązań DOM z oryginalnego kodu v7
        document.getElementById('add-person-form').onsubmit = handleFormSubmit;
        document.getElementById('start-btn').onclick = startTournament;
        document.getElementById('restart-btn').onclick = startTournament;
        document.getElementById('reset-btn').onclick = resetTournament;
        document.getElementById("participant-limit").addEventListener("change", updateStartButton);
        setupExcelAndJsonButtons();
        updateAll();
    }

    function generateJackboxRoom() {
        // Generuj 4-literowy kod pokoju
        const chars = "ABCDEFGHIJKLMNPQRSTUVWXYZ";
        activeRoomId = "";
        for (let i = 0; i < 4; i++) {
            activeRoomId += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('room-code-display').textContent = activeRoomId;

        // Dynamiczne wygenerowanie linku bezpośredniego i wstawienie obrazka kodu QR
        const currentUrl = window.location.href.split('?')[0];
        const joinUrl = `${currentUrl}?role=voter&room=${activeRoomId}`;
        const qrContainer = document.getElementById('jackbox-qr');
        qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(joinUrl)}" alt="QR Code" />`;

        // Łączenie z MQTT ze strony hosta
        mqttClient = mqtt.connect('wss://broker.hivemq.com:8004/mqtt');
        mqttClient.on('connect', () => {
            mqttClient.subscribe(`${baseTopic}${activeRoomId}/voters_to_host`);
        });

        mqttClient.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());
            if (data.type === 'ping') {
                votersList.add(data.voter);
                document.getElementById('connected-count').textContent = votersList.size;
                updateVoteDotsDisplay();
            } else if (data.type === 'vote') {
                votersList.add(data.voter);
                dynamicVotes[data.voter] = data.choice;
                updateVoteDotsDisplay();
                checkVotesCompletion();
            }
        });
    }

    function updateVoteDotsDisplay() {
        if (!votingModeEnabled) return;
        const progressDiv = document.getElementById('vote-progress');
        let html = "";
        votersList.forEach(voter => {
            const voted = dynamicVotes.hasOwnProperty(voter);
            html += `<span class="vote-dot ${voted ? 'voted' : ''}" title="${voter}"></span>`;
        });
        const total = votersList.size;
        const votedCount = Object.keys(dynamicVotes).length;
        html += ` <strong>(${votedCount}/${total} głosów)</strong>`;
        progressDiv.innerHTML = html;
    }

    function checkVotesCompletion() {
        const total = votersList.size;
        const votedCount = Object.keys(dynamicVotes).length;
        // Gdy wszyscy połączeni piloci oddadzą głos (minimum 1) podlicz automatycznie runda przechodzi dalej
        if (total > 0 && votedCount >= total) {
            processJackboxVotesResult();
        }
    }

    function processJackboxVotesResult() {
        let count0 = 0; let count1 = 0;
        Object.values(dynamicVotes).forEach(v => {
            if (v === 0) count0++;
            if (v === 1) count1++;
        });

        const winnerIndex = count0 >= count1 ? 0 : 1;
        const participants = roundsData[currentRound];
        const name0 = participants[currentPairIndex].name;
        const name1 = participants[currentPairIndex + 1].name;

        const voteResultBar = document.getElementById('vote-result-bar');
        voteResultBar.innerHTML = `
            <span><span class="vote-count">${count0}</span> głos${count0 === 1 ? '' : (count0 < 5 ? 'y' : 'ów')} — ${name0}</span>
            <span style="color:#555">vs</span>
            <span>${name1} — <span class="vote-count">${count1}</span> głos${count1 === 1 ? '' : (count1 < 5 ? 'y' : 'ów')}</span>
        `;

        const choice1 = document.getElementById('choice1');
        const choice2 = document.getElementById('choice2');
        const winCard = winnerIndex === 0 ? choice1 : choice2;
        const loseCard = winnerIndex === 0 ? choice2 : choice1;
        winCard.classList.add('winner-flash');
        loseCard.classList.add('loser-fade');

        // Powiadom telefony o zakończeniu głosowania
        if(mqttClient) {
            mqttClient.publish(`${baseTopic}${activeRoomId}/host_to_voters`, JSON.stringify({type: 'round_ended'}));
        }

        setTimeout(() => {
            winCard.classList.remove('winner-flash');
            loseCard.classList.remove('loser-fade');
            voteResultBar.innerHTML = '';
            document.getElementById('vote-progress').innerHTML = '';
            dynamicVotes = {};
            commitWinner(winnerIndex);
        }, 3000);
    }

    // --- Logika zarządzania i turnieju (Oryginalna z v7 z adaptacją pod sieć) ---
    let tournamentParticipants = [];
    let currentRound = 0;
    let rounds = [];
    let currentPairIndex = 0;
    let roundsData = [];

    function handleFormSubmit(e) {
        e.preventDefault();
        const name = document.getElementById('new-name').value.trim();
        const image = document.getElementById('new-image').value.trim();
        const description = document.getElementById("new-person-description").value.trim();
        if (name && image && description) {
            people.push({ name, image, description });
            document.getElementById('add-person-form').reset();
            updateAll();
        }
    }

    function startTournament() {
        const filteredPeople = selectedCategories.size > 0 
            ? people.filter(person => selectedCategories.has(person.description))
            : people;

        const limit = getParticipantLimit();
        let participants = filteredPeople.slice();

        if (limit) { participants = shuffleArray(participants).slice(0, limit); }
        if (participants.length < 2) {
            alert('Za mało uczestników, aby rozpocząć turniej (minimum 2).');
            return;
        }

        tournamentParticipants = shuffleArray(participants);
        rounds = [];
        let count = tournamentParticipants.length;
        while (count > 1) {
            rounds.push(count);
            count = Math.ceil(count / 2);
        }

        roundsData = [];
        roundsData[0] = tournamentParticipants.slice();
        currentRound = 0;
        currentPairIndex = 0;

        document.getElementById('winner-display').innerHTML = '';
        document.getElementById('bye-message').textContent = '';
        document.getElementById('vote-progress').innerHTML = '';
        document.getElementById('vote-result-bar').innerHTML = '';
        
        document.getElementById('choice-container').style.display = 'flex';
        document.getElementById('start-btn').disabled = true;
        document.getElementById('people-management').classList.add('hidden-section');
        document.getElementById('import-export').classList.add('hidden-section');

        processByesForCurrentRound();
        showCurrentPair();
    }

    function showCurrentPair() {
        const participants = roundsData[currentRound];
        if (!participants || currentPairIndex >= participants.length) {
            if (currentRound < rounds.length) { nextRound(); } 
            else if (participants && participants.length === 1) { declareWinner(participants[0]); }
            return;
        }

        const p1 = participants[currentPairIndex];
        const p2 = participants[currentPairIndex + 1];

        setChoice(document.getElementById('choice1'), p1);
        setChoice(document.getElementById('choice2'), p2);
        
        document.getElementById('round-indicator').textContent = `Runda: ${currentRound + 1} z ${rounds.length} – Para ${Math.floor(currentPairIndex / 2) + 1} z ${Math.ceil(participants.length / 2)}`;

        // WYŚLIJ INFORMACJĘ DO TELEFONÓW O NOWEJ PARZE
        if (votingModeEnabled && mqttClient && activeRoomId) {
            dynamicVotes = {};
            updateVoteDotsDisplay();
            mqttClient.publish(`${baseTopic}${activeRoomId}/host_to_voters`, JSON.stringify({
                type: 'new_pair',
                p1: p1.name,
                p2: p2.name
            }));
        }
    }

    function setChoice(elem, person) {
        elem.querySelector('img').src = person.image;
        elem.querySelector('img').alt = person.name;
        elem.querySelector('h3').textContent = person.name;
        elem.querySelector('p').textContent = person.description;
    }

    document.getElementById('choice1').onclick = () => { if(!votingModeEnabled) commitWinner(0); };
    document.getElementById('choice2').onclick = () => { if(!votingModeEnabled) commitWinner(1); };

    function commitWinner(index) {
        const participants = roundsData[currentRound];
        const winner = participants[currentPairIndex + index];
        if (!roundsData[currentRound + 1]) { roundsData[currentRound + 1] = []; }
        roundsData[currentRound + 1].push(winner);
        currentPairIndex += 2;
        showCurrentPair();
    }

    function nextRound() {
        currentRound++;
        currentPairIndex = 0;
        if (!roundsData[currentRound] || roundsData[currentRound].length === 0) {
            declareWinner(roundsData[currentRound-1][0]);
            return;
        }
        if (roundsData[currentRound].length === 1) {
             declareWinner(roundsData[currentRound][0]);
             return;
        }
        roundsData[currentRound] = shuffleArray(roundsData[currentRound].slice());
        processByesForCurrentRound();
        showCurrentPair();
    }

    function declareWinner(person) {
        document.getElementById('choice-container').style.display = 'none';
        document.getElementById('round-indicator').textContent = '🏁 Turniej zakończony! 🏁';
        document.getElementById('winner-display').innerHTML = `<h2>Zwycięzca:</h2><h3>${person.name}</h3><img src="${person.image}" alt="${person.name}" /><p>Kategoria: ${person.description}</p>`;
        document.getElementById('start-btn').disabled = false;
        document.getElementById('people-management').classList.remove('hidden-section');
        document.getElementById('import-export').classList.remove('hidden-section');
    }

    function processByesForCurrentRound() {
        if (!roundsData[currentRound]) return;
        let participantsInRound = roundsData[currentRound];
        if (participantsInRound.length % 2 !== 0 && participantsInRound.length > 1) {
            const byePerson = participantsInRound.pop();
            if (!roundsData[currentRound + 1]) { roundsData[currentRound + 1] = []; }
            roundsData[currentRound + 1].push(byePerson);
        }
    }

    function resetTournament() {
        tournamentParticipants = []; currentRound = 0; rounds = []; currentPairIndex = 0; roundsData = []; dynamicVotes = {};
        document.getElementById('choice-container').style.display = 'none';
        document.getElementById('winner-display').innerHTML = '';
        document.getElementById('round-indicator').textContent = '';
        document.getElementById('vote-progress').innerHTML = '';
        document.getElementById('vote-result-bar').innerHTML = '';
        document.getElementById('start-btn').disabled = false;
        document.getElementById('people-management').classList.remove('hidden-section');
        document.getElementById('import-export').classList.remove('hidden-section');
        updateStartButton();
    }

    // --- Reszta funkcji pomocniczych ---
    function updateCategorySelectCheckboxes() {
        const container = document.getElementById('category-select-container');
        container.innerHTML = '';
        categories.sort().forEach(cat => {
            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = cat;
            checkbox.checked = selectedCategories.has(cat);
            checkbox.onchange = () => {
                if (checkbox.checked) selectedCategories.add(cat); else selectedCategories.delete(cat);
                updateStartButton();
            };
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(' ' + cat));
            container.appendChild(label);
        });
    }

    function updatePeopleList() {
        const list = document.getElementById('people-list');
        list.innerHTML = '';
        if (people.length === 0) { list.textContent = 'Brak dodanych osób.'; return; }
        people.forEach((person, i) => {
            const div = document.createElement('div');
            div.className = 'person-item';
            div.innerHTML = `
                <div class="person-info">
                    <img src="${person.image}" alt="${person.name}">
                    <div>
                        <div class="name">${i + 1}. ${person.name}</div>
                        <div class="cat">Kategoria: ${person.description}</div>
                    </div>
                </div>
                <div class="person-actions">
                    <button onclick="people.splice(${i}, 1); updateAll();" style="background:#aa2222;">Usuń</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function updateStartButton() {
        const limit = getParticipantLimit();
        const filteredCount = selectedCategories.size > 0 ? people.filter(p => selectedCategories.has(p.description)).length : people.length;
        document.getElementById('start-btn').disabled = limit ? filteredCount < limit : filteredCount < 2;
    }

    function getParticipantLimit() {
        const val = document.getElementById("participant-limit").value;
        return val ? parseInt(val, 10) : null;
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateAll() {
        const allDescriptions = new Set(people.map(p => p.description));
        categories = Array.from(allDescriptions);
        selectedCategories = new Set([...selectedCategories].filter(cat => categories.includes(cat)));
        updateCategorySelectCheckboxes();
        updatePeopleList();
        updateStartButton();
    }

    function setupExcelAndJsonButtons() {
        document.getElementById("export-excel-btn").onclick = function () {
            if (people.length === 0) return;
            const data = people.map(p => ({"Imię i nazwisko": p.name, "Kategoria": p.description, "Zdjęcie": p.image}));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Osoby");
            XLSX.writeFile(wb, "lista_osob.xlsx");
        };

        document.getElementById('export-btn').onclick = () => {
            const blob = new Blob([JSON.stringify({people: people}, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'turniej-dane.json';
            a.click();
        };

        document.getElementById('import-btn').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = evt => {
                const imported = JSON.parse(evt.target.result);
                if (Array.isArray(imported.people)) people = people.concat(imported.people);
                updateAll();
            };
            r.readAsText(file);
        };

        document.getElementById("import-excel-btn").onclick = () => document.getElementById("import-excel-input").click();
        document.getElementById("import-excel-input").onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = evt => {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                json.forEach(row => {
                    if (row["Imię i nazwisko"] && row["Kategoria"]) {
                        people.push({name: String(row["Imię i nazwisko"]), description: String(row["Kategoria"]), image: row["Zdjęcie"] || "https://via.placeholder.com/300"});
                    }
                });
                updateAll();
            };
            reader.readAsArrayBuffer(file);
        };
    }
</script>
